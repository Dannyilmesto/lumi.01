[project]
name = "serramenti-document-worker"
version = "0.1.0"
description = "Worker per elaborare PDF dei listini serramenti"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4,<13",
    "pdfplumber>=0.11.7,<0.12",
    "pypdfium2>=4.30,<5",
    "pytesseract>=0.3.13,<0.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff>=0.14.0", "pytest>=8.4.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

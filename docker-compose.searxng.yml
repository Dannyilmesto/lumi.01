name: lumi-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: lumi-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8889:8080"
    env_file:
      - ./apps/web/searxng/.env
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8889/
    volumes:
      - ./apps/web/searxng/settings.yml:/etc/searxng/settings.yml:ro
